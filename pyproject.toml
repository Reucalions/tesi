[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-agents"
version = "0.1.0"
description = "Prototipo CAMEL con contratti Pydantic e tool locali per la tesi"
requires-python = ">=3.11,<3.13"
dependencies = [
  "camel-ai==0.2.90",
  "pydantic==2.12.0",
  "mcp>=1.3,<2",
  "openai>=1.86,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
thesis-agents = "thesis_agents.main:main"

[tool.setuptools.packages.find]
include = ["thesis_agents*"]

[tool.setuptools.package-data]
thesis_agents = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

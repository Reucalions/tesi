# Metadati di packaging e configurazione degli strumenti Python.
# pip usa questo file per installare il package e le sue dipendenze. I commenti
# spiegano le scelte; i valori restano quelli del prototipo verificato.
[build-system]
# setuptools costruisce il package, anche per l'installazione modificabile «-e».
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
# Nome distribuzione (con trattino) e versione sono distinti dal package importabile
# thesis_agents (con underscore). L'intervallo Python segue il setup del prototipo.
name = "thesis-agents"
version = "0.1.0"
description = "Prototipo CAMEL con contratti Pydantic e tool locali per la tesi"
requires-python = ">=3.11,<3.13"
dependencies = [
  # CAMEL e Pydantic sono fissati per stabilizzare API e contratti del primo MVP.
  "camel-ai==0.2.90",
  "pydantic==2.12.0",
  # MCP 2 non è compatibile con l'import FastMCP usato da questa versione CAMEL.
  # L'SDK OpenAI è un requisito anche quando i mock di dominio sono tutti locali.
  "mcp>=1.3,<2",
  "openai>=1.86,<3",
  # Caricamento opzionale della configurazione da .env nella CLI.
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
# L'extra dev aggiunge test e controlli statici: pip install -e '.[dev]'.
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
# Crea il comando di shell «thesis-agents», equivalente alla funzione main del package.
thesis-agents = "thesis_agents.main:main"

[tool.setuptools.packages.find]
# Include il codice applicativo, evitando di distribuire tests come package di runtime.
include = ["thesis_agents*"]

[tool.setuptools.package-data]
# La fixture deve essere inclusa nell'installazione per essere letta con importlib.resources.
thesis_agents = ["data/*.json"]

[tool.pytest.ini_options]
# Limita la ricerca automatica dei test alla directory del progetto.
testpaths = ["tests"]

[tool.ruff]
# Le regole sintattiche seguono la versione minima Python supportata.
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E: stile; F: errori Python; I: import; UP: sintassi moderna; B: errori comuni/bugbear.
select = ["E", "F", "I", "UP", "B"]